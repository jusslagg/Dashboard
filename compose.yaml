name: dashboard-facturacion

services:
  web:
    image: ${DASHBOARD_IMAGE:-dashboard-facturacion:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:${DASHBOARD_PORT:-8010}:8009"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Configura una SECRET_KEY persistente en .env.docker}
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////opt/dashboard/instance/facturacion.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8010,http://127.0.0.1:8010}
      APP_DEFAULT_YEAR: ${APP_DEFAULT_YEAR:-2026}
      PLP_BASE_YEAR: ${PLP_BASE_YEAR:-2026}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      SESSION_MINUTES: ${SESSION_MINUTES:-60}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-10485760}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
      LOGIN_BLOCK_SECONDS: ${LOGIN_BLOCK_SECONDS:-300}
      FLASK_HOST: 0.0.0.0
      PORT: "8009"
      USE_DEV_SERVER: "0"
      FLASK_DEBUG: "0"
      FLASK_RELOAD: "0"
      TEMPLATES_AUTO_RELOAD: "0"
    volumes:
      - dashboard_data:/opt/dashboard/instance
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dashboard_data:
