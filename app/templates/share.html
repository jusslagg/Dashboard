{% extends "layout.html" %}{% block title %}Share | Directorio{% endblock %}{% block content %}
<div class="mx-auto max-w-[1500px]"><div class="mb-5"><p class="text-xs font-bold uppercase tracking-[.2em] text-blue-600">Directorio</p><h1 class="text-3xl font-black">Share</h1><p class="text-sm text-slate-500">Participación anual calculada desde Histórico y Dotaciones Requeridas.</p></div>
<section class="mb-4 rounded-2xl border bg-white p-4 shadow-sm"><div class="flex flex-wrap items-end gap-3"><label class="text-xs font-bold">Desde<select id="desde" onchange="render()" class="mt-1 block rounded border px-3 py-2"></select></label><label class="text-xs font-bold">Hasta<select id="hasta" onchange="render()" class="mt-1 block rounded border px-3 py-2"></select></label><span class="ml-2 text-sm font-bold">Paleta por año</span><div id="paleta" class="flex flex-wrap gap-2"></div><label class="text-xs font-bold">Fondo<input id="fondo" type="color" onchange="cambiarFondo()" class="mt-1 block h-9 w-14"></label><button onclick="restaurar()" class="rounded-lg border px-3 py-2 text-xs font-bold">Restaurar</button><span class="grow"></span><button onclick="copiarGrafico()" class="rounded-lg bg-blue-700 px-4 py-2 text-sm font-bold text-white"><i class="fas fa-copy mr-2"></i>Copiar imagen</button><button onclick="descargarGrafico()" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-bold"><i class="fas fa-download mr-2"></i>Descargar PNG</button></div></section>
<section class="mb-4 rounded-2xl border bg-white p-4 shadow-sm"><div class="h-[610px]"><canvas id="grafico"></canvas></div></section>
<section class="mb-4 overflow-hidden rounded-2xl border bg-white"><div class="overflow-auto p-5"><table id="tablaHoras" class="min-w-[950px] w-full border-collapse text-sm"></table></div></section>
<section class="overflow-hidden rounded-2xl border bg-white"><div class="overflow-auto p-5"><table id="tablaDotaciones" class="min-w-[950px] w-full border-collapse text-sm"></table></div></section></div>
{% endblock %}{% block scripts %}<script>
let datos,chart;const grupos=['Personal','Santander','Multicampania','USA'],nombres={Personal:'Personal',Santander:'Santander',Multicampania:'Multicampaña',USA:'USA'},baseColores=['#4472c4','#ffa700','#00cbc6','#f05a8e','#e4ee5b','#70ad47','#5b9bd5'];let colores=JSON.parse(localStorage.getItem('paletaShare')||'null')||baseColores,fondoColor=localStorage.getItem('fondoShare')||'#ffffff';const fmt=v=>new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}).format(v),pct=v=>new Intl.NumberFormat('es-AR',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1}).format(v);
const fondoPlugin={id:'fondoShare',beforeDraw(ch){ch.ctx.save();ch.ctx.fillStyle=fondoColor;ch.ctx.fillRect(0,0,ch.width,ch.height);ch.ctx.restore()}},labels={id:'labelsShare',afterDatasetsDraw(ch){const c=ch.ctx;c.save();c.textAlign='center';c.textBaseline='middle';ch.data.datasets.forEach((d,di)=>ch.getDatasetMeta(di).data.forEach((e,i)=>{const v=d.data[i];if(v==null)return;c.save();c.translate(e.x,(e.y+e.base)/2);c.rotate(-Math.PI/2);c.fillStyle='#172033';c.font='700 10px Arial';c.fillText(pct(v),0,0);c.restore()}));c.restore()}};
function paletaUI(){paleta.innerHTML=datos.anios.map((a,i)=>`<label class="text-[10px] font-bold">${a}<input type="color" value="${colores[i%colores.length]}" onchange="cambiarColor(${i},this.value)" class="mt-1 block h-8 w-11"></label>`).join('');fondo.value=fondoColor}function cambiarColor(i,v){colores[i]=v;localStorage.setItem('paletaShare',JSON.stringify(colores));render()}function cambiarFondo(){fondoColor=fondo.value;localStorage.setItem('fondoShare',fondoColor);render()}function restaurar(){colores=[...baseColores];fondoColor='#ffffff';localStorage.removeItem('paletaShare');localStorage.removeItem('fondoShare');paletaUI();render()}
function canvasExportacion(){const origen=document.getElementById('grafico'),salida=document.createElement('canvas');salida.width=origen.width;salida.height=origen.height;const c=salida.getContext('2d');c.fillStyle=fondoColor;c.fillRect(0,0,salida.width,salida.height);c.drawImage(origen,0,0);return salida}async function copiarGrafico(){try{const blob=await new Promise(resolve=>canvasExportacion().toBlob(resolve,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);alert('Gráfico copiado. Ya podés pegarlo en PowerPoint con Ctrl + V.')}catch(e){alert('El navegador no permitió copiar la imagen. Usá Descargar PNG.')}}function descargarGrafico(){const a=document.createElement('a');a.download=`share-${desde.value}-${hasta.value}.png`;a.href=canvasExportacion().toDataURL('image/png');a.click()}
function tabla(el,filas,tipo){const seleccion=filas.filter(x=>x.year>=+desde.value&&x.year<=+hasta.value),cabecera=titulo=>`<tr class="bg-[#bfbfbf] text-slate-950"><th class="border border-slate-500 p-2 text-left font-black">${titulo}</th>${seleccion.map(x=>`<th class="border border-slate-500 p-2 text-center font-black">${x.year}</th>`).join('')}</tr>`,fila=(titulo,fn,clase='')=>`<tr><th class="border-x border-b border-slate-400 p-2 text-left font-semibold ${clase}">${titulo}</th>${seleccion.map(x=>`<td class="border-r border-b border-slate-400 p-2 text-right ${clase}">${fn(x)}</td>`).join('')}</tr>`,espacio=`<tr><td colspan="${seleccion.length+1}" class="h-5"></td></tr>`,tituloPrincipal=tipo==='horas'?'Horas':'Dotación Requerida Promedio',tituloCombinado=tipo==='horas'?'Horas':'Requerido';el.innerHTML=`<tbody>${cabecera(tituloPrincipal)}${grupos.map(g=>fila(nombres[g],x=>fmt(x[g]))).join('')}${fila('Total',x=>fmt(x.Total),'font-bold bg-slate-50')}${espacio}${cabecera('% Share')}${grupos.map(g=>fila(nombres[g],x=>pct(x.shares[g]))).join('')}${fila('Total',()=>pct(1),'font-bold bg-slate-50')}${espacio}${cabecera('Personal + Santander')}${fila(tituloCombinado,x=>fmt(x.personal_santander),'font-bold')}${fila('% Share',x=>pct(x.share_personal_santander),'font-bold bg-blue-50')}</tbody>`}
function render(){const indices=datos.anios.map((a,i)=>({a,i})).filter(x=>x.a>=+desde.value&&x.a<=+hasta.value),horas=datos.horas.filter(x=>indices.some(y=>y.a===x.year));tabla(tablaHoras,datos.horas,'horas');tabla(tablaDotaciones,datos.dotaciones,'dotaciones');if(chart)chart.destroy();chart=new Chart(grafico,{type:'bar',data:{labels:grupos.map(g=>nombres[g]),datasets:horas.map(x=>({label:String(x.year),data:grupos.map(g=>x.shares[g]),backgroundColor:colores[datos.anios.indexOf(x.year)%colores.length],borderWidth:0}))},plugins:[fondoPlugin,labels],options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:20}},plugins:{legend:{position:'bottom'}},scales:{x:{stacked:false,grid:{display:false}},y:{beginAtZero:true,max:.6,grid:{display:false},ticks:{stepSize:.1,callback:pct}}}}})}
fetch('/api/share').then(r=>r.json()).then(d=>{datos=d;desde.innerHTML=hasta.innerHTML=d.anios.map(a=>`<option>${a}</option>`).join('');desde.value=d.anios[0];hasta.value=d.anios.at(-1);paletaUI();render()});
</script>{% endblock %}
